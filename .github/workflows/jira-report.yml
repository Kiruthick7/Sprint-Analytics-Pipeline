name: Jira Sprint Report

on:
  schedule:
    # 7:00 AM IST = 01:30 UTC
    # Weekdays only (Mon-Fri = 1-5)
    - cron: '30 1 * * 1-6'
  workflow_dispatch:

concurrency:
  group: jira-sprint-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Jira Report
        env:
          # Jira
          JIRA_SERVER: https://hy-vee.atlassian.net
          JIRA_USER_NAME: ${{ secrets.JIRA_USER_NAME }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}

          # Confluence
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_USER: ${{ secrets.CONFLUENCE_USER }}
          CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
          CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}

          # Teams
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}

          # LLM / AI Providers
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

          # Optional links in report
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          VELOCITY_DASHBOARD_URL: ${{ secrets.VELOCITY_DASHBOARD_URL }}

        run: python main.py --run-report
